[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo.log
log_level = info

; ---------------------------------------------------------------
; OBLIGATORIO cuando Odoo está detrás de Traefik / nginx
; Sin esto los assets CSS/JS devuelven 500
; ---------------------------------------------------------------
proxy_mode = True

; Ajusta según tu RAM disponible (recomendado: núcleos × 2)
; En desarrollo déjalo en 0 (modo single-thread)
workers = 0

; Límites de tiempo de solicitud (en segundos)
limit_time_cpu = 600
limit_time_real = 1200

; ---------------------------------------------------------------
; Conexión a base de datos
; NOTA: Las variables de entorno HOST / PORT / USER / PASSWORD del
; docker-compose tienen PRIORIDAD sobre estas opciones.
; Úsalas solo si corres Odoo fuera de Docker.
; ---------------------------------------------------------------
; db_host = 191.96.31.105
; db_port = 5432
; db_user = odoo
; db_password = tu_password

